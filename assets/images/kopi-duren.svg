  <path d="M137 313 C144 316 149 321 154 325" fill="none" stroke="#f5c542" stroke-width="2" stroke-linecap="round" />
  <path d="M185 322 C192 324 197 328 202 331" fill="none" stroke="#f5c542" stroke-width="2" stroke-linecap="round" />
  <path d="M531 317 C538 319 543 323 548 327" fill="none" stroke="#f5c542" stroke-width="2" stroke-linecap="round" />
</svg>
