<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="judul-proses deskripsi-proses">
  <title id="judul-proses">Proses seduh manual Kopi Nusa</title>
  <desc id="deskripsi-proses">Ilustrasi teko gooseneck biru hitam beraksen emas yang menuangkan air panas ke dripper di atas server kopi.</desc>

  <rect width="640" height="360" fill="#e2e8f0" />
  <circle cx="586" cy="58" r="34" fill="none" stroke="#d4af37" stroke-width="3" opacity="0.6" />
  <circle cx="586" cy="58" r="20" fill="none" stroke="#d4af37" stroke-width="2" opacity="0.45" />

  <!-- Meja -->
  <rect y="288" width="640" height="72" fill="#0b132b" />
  <rect y="288" width="640" height="6" fill="#d4af37" />

  <!-- Uap air -->
  <g fill="none" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" opacity="0.65">
    <path d="M470 128 c-9 -14 9 -22 0 -38" />
    <path d="M492 136 c-9 -14 9 -22 0 -38" />
  </g>

  <!-- Teko gooseneck -->
  <path d="M66 182 C26 182 26 244 68 244" fill="none" stroke="#d4af37" stroke-width="13" stroke-linecap="round" />
  <rect x="64" y="150" width="172" height="118" rx="26" fill="#111c3a" stroke="#d4af37" stroke-width="4" />
  <rect x="92" y="132" width="116" height="20" rx="10" fill="#0b132b" stroke="#f5c542" stroke-width="3" />
  <circle cx="150" cy="132" r="7" fill="#f5c542" />
  <path d="M232 190 C280 190 300 150 318 122 C326 108 344 106 348 120" fill="none" stroke="#d4af37" stroke-width="13" stroke-linecap="round" />
  <rect x="76" y="238" width="148" height="10" rx="5" fill="#f5c542" />
  <text x="150" y="214" fill="#f5c542" font-family="Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="2" text-anchor="middle">KOPI NUSA</text>

  <!-- Aliran air -->
  <path d="M348 124 C352 144 376 154 406 166" fill="none" stroke="#7dd3fc" stroke-width="6" stroke-linecap="round" />
  <circle cx="410" cy="173" r="4" fill="#7dd3fc" />
  <circle cx="415" cy="182" r="3" fill="#7dd3fc" opacity="0.8" />

  <!-- Dripper V60 -->
  <path d="M332 160 H500 L454 244 H378 Z" fill="#0b132b" stroke="#f5c542" stroke-width="4" stroke-linejoin="round" />
  <ellipse cx="416" cy="160" rx="84" ry="12" fill="#111c3a" stroke="#f5c542" stroke-width="4" />
  <ellipse cx="416" cy="162" rx="64" ry="8" fill="#6f4e37" />
  <path d="M378 198 H454 M388 220 H444" stroke="#d4af37" stroke-width="3" opacity="0.55" />

  <!-- Server kopi -->
  <path d="M408 240 C408 252 412 258 416 262" fill="none" stroke="#6f4e37" stroke-width="3" stroke-linecap="round" />
  <path d="M378 244 H454 V270 C454 280 448 286 438 286 H394 C384 286 378 280 378 270 Z" fill="#111c3a" stroke="#d4af37" stroke-width="4" />
  <path d="M386 262 H446 V270 C446 276 442 280 438 280 H394 C390 280 386 276 386 270 Z" fill="#6f4e37" />
  <path d="M454 258 C472 258 474 274 456 276" fill="none" stroke="#d4af37" stroke-width="5" stroke-linecap="round" />

  <!-- Biji kopi di meja -->
  <g fill="#6f4e37" stroke="#d4af37" stroke-width="2">
    <ellipse cx="560" cy="320" rx="20" ry="12" transform="rotate(-18 560 320)" />
    <ellipse cx="602" cy="328" rx="20" ry="12" transform="rotate(12 602 328)" />
  </g>
  <path d="M552 315 C558 318 562 322 566 326" fill="none" stroke="#f5c542" stroke-width="2" stroke-linecap="round" />
  <path d="M594 324 C600 326 604 330 608 333" fill="none" stroke="#f5c542" stroke-width="2" stroke-linecap="round" />
</svg>
